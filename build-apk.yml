name: Build Android APK

# Perintah ini membuat tombol agar kita bisa klik "Run" secara manual
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Kita arahkan sistem untuk bekerja di dalam folder android_app
    defaults:
      run:
        working-directory: ./android_app

    steps:
    - name: Mengambil Kode Repository
      uses: actions/checkout@v4

    - name: Menyiapkan Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17' 

    - name: Menyiapkan Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Mengunduh Dependensi
      run: flutter pub get

    - name: Merakit File APK
      run: flutter build apk --release

    - name: Mengunggah Hasil APK
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Android-Release
        path: android_app/build/app/outputs/flutter-apk/app-release.apk
