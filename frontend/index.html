<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>w8premiumyt - Dashboard SMS Gateway</title>
		<!-- Memuat Supabase Client SDK -->
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.0/dist/umd/supabase.min.js"></script>
		<style>
			body {
				font-family: Arial, sans-serif;
				background-color: #121212;
				color: #ffffff;
				margin: 20px;
			}
			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				border-bottom: 2px solid #333;
				padding-bottom: 10px;
			}
			.status-container {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.indicator {
				width: 15px;
				height: 15px;
				border-radius: 50%;
				background-color: #ff3333;
			}
			.indicator.online {
				background-color: #33ff33;
			}
			table {
				width: 100%;
				border-collapse: collapse;
				margin-top: 20px;
			}
			th,
			td {
				padding: 12px;
				text-align: left;
				border-bottom: 1px solid #333;
			}
			th {
				background-color: #1f1f1f;
			}
			tr:hover {
				background-color: #1a1a1a;
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h2>w8premiumyt SMS Dashboard</h2>
			<div class="status-container">
				<span>Status HP:</span>
				<div
					id="statusLamp"
					class="indicator"></div>
				<strong id="statusText">OFFLINE</strong>
			</div>
		</div>

		<table>
			<thead>
				<tr>
					<th>Pengirim</th>
					<th>Pesan / OTP</th>
					<th>Waktu Masuk</th>
				</tr>
			</thead>
			<tbody id="smsTableBody">
				<tr>
					<td
						colspan="3"
						style="text-align: center; color: #888">
						Menunggu data dari Supabase...
					</td>
				</tr>
			</tbody>
		</table>

		<script>
			// KONFIGURASI SUPABASE KAWAN (Ganti sesuai milik Anda)
			const SUPABASE_URL = "https://oycyuxxqmeqvyaipknkr.supabase.co"
			const SUPABASE_ANON_KEY =
				"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95Y3l1eHhxbWVxdnlhaXBrbmtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTc4MzMsImV4cCI6MjA5NTM5MzgzM30.LAECvRwsBvEPOz19l8cy8Hct2F4j0Lta9I-GPmIFcHI"

			// Inisialisasi Supabase Client - USING GLOBAL SUPABASE OBJECT
			const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

			// 1. Ambil data SMS Lama saat Web pertama kali dibuka
			async function muatSmsLama() {
				const { data, error } = await supabase.from('sms_inbox').select('*').order('timestamp', { ascending: false }).limit(50)

				if (!error && data) {
					const tbody = document.getElementById('smsTableBody')
					tbody.innerHTML = ''
					if (data.length === 0) {
						tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #888;">Belum ada SMS masuk</td></tr>'
						return
					}
					data.forEach(sms => tambahBarisTabel(sms))
				}
			}

			async function muatStatusPerangkat() {
				const { data, error } = await supabase.from('device_status').select('device_id,status').order('updated_at', { ascending: false }).limit(1)
				const lamp = document.getElementById('statusLamp')
				const text = document.getElementById('statusText')

				if (error || !data || data.length === 0) {
					lamp.className = 'indicator'
					text.innerText = 'OFFLINE'
					return
				}

				if (data[0].status === 'ONLINE') {
					lamp.className = 'indicator online'
					text.innerText = 'ONLINE'
				} else {
					lamp.className = 'indicator'
					text.innerText = 'OFFLINE'
				}
			}

			// 2. Fungsi Menampilkan Data ke Tabel HTML
			function tambahBarisTabel(sms) {
				const tbody = document.getElementById('smsTableBody')
				const row = document.createElement('tr')

				const waktu = new Date(sms.timestamp).toLocaleString('id-ID')

				row.innerHTML = `
                <td style="color: #33ff33; font-weight: bold;">${sms.sender}</td>
                <td>${sms.message}</td>
                <td style="color: #888;">${waktu}</td>
            `
				tbody.insertBefore(row, tbody.firstChild)
			}

			// 3. MENDENGARKAN SMS BARU SECARA REAL-TIME DARI SUPABASE
			supabase
				.channel('custom-filter-channel')
				.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sms_inbox' }, payload => {
					// Begitu ada data masuk ke Supabase, langsung muncul di web tanpa refresh!
					tambahBarisTabel(payload.new)
				})
				.subscribe()

			// 4. MENDENGARKAN STATUS HEARTBEAT HP (PING)
			supabase
				.channel('device-status-channel')
				.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'device_status' }, payload => {
					const lamp = document.getElementById('statusLamp')
					const text = document.getElementById('statusText')

					if (payload.new.status === 'ONLINE') {
						lamp.className = 'indicator online'
						text.innerText = 'ONLINE'
					} else {
						lamp.className = 'indicator'
						text.innerText = 'OFFLINE'
					}
				})
				.subscribe()

			// Jalankan fungsi load data pertama kali
			muatSmsLama()
			muatStatusPerangkat()
		</script>
	</body>
</html>
